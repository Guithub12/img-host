<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image</title>
  <style>
    :root { --bg: #f2f2f0; --fg: #1a1a1a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1a1a; --fg: #f2f2f0; } }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg);
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
    }
    img {
      max-width: 100%;
      min-height: 0;
      max-height: calc(100% - 60px);
      object-fit: contain;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Please authenticate using Discord</h1>
  <img src="https://i.ibb.co/tTqsmbFj/Screenshot-2026-10-13-172442.png" alt="Screenshot">
</body>
</html>
