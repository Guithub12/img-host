<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image</title>
  <style>
    :root { --bg: #f2f2f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1a1a; } }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <img src="https://i.ibb.co/tTqsmbFj/Screenshot-2026-10-13-172442.png" alt="Screenshot">
</body>
</html>
